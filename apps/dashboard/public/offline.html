<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <title>Servidor indisponível | LAB/MONITOR</title>
  <style>
    :root { color-scheme: light; font-family: "DM Sans", system-ui, sans-serif; color: #202927; background: #f5f6f3; }
    * { box-sizing: border-box; }
    body { display: grid; min-width: 320px; min-height: 100vh; margin: 0; padding: 24px; place-items: center; }
    main { display: grid; width: min(100%, 420px); justify-items: center; gap: 12px; padding: 32px 28px; border: 1px solid #e2e8e1; border-radius: 8px; background: #fff; text-align: center; box-shadow: 0 12px 36px rgba(30, 51, 39, .08); }
    img { width: 68px; height: 68px; border-radius: 50%; object-fit: contain; background: #fff; }
    .brand { margin: 4px 0 0; color: #287b65; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: 25px; font-weight: 700; }
    p { max-width: 340px; margin: 0; color: #65716b; font-size: 14px; line-height: 1.55; }
    button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; padding: 0 18px; border: 0; border-radius: 5px; color: #fff; background: #287b65; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #8ac4a5; outline-offset: 3px; }
  </style>
</head>
<body>
  <main role="alert" aria-live="polite">
    <img src="/logo.jpg" alt="">
    <span class="brand">LAB / MONITOR</span>
    <h1>Servidor indispon&iacute;vel</h1>
    <p>N&atilde;o foi poss&iacute;vel conectar ao servidor. Verifique a rede e tente novamente.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
