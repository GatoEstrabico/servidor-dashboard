services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitoramento
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor_dev
    ports:
      - "5432:5432"
    volumes:
      - monitoramento_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitoramento"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  monitoramento_data:
